# 게임 버전 — **모델이 받는 입력의 버전**이다 (docs/llm/models.md §5-2).
#
# 기록된 호출 하나하나에 이 값이 함께 남으므로, 반년 전의 로그를 열었을 때 그것이
# 지금과 같은 프롬프트·같은 도구·같은 모델에서 나온 답인지가 그 자리에서 갈린다.
# 버전이 다르면 두 응답의 차이는 모델의 변덕이 아니라 입력의 차이다.
#
# 올리는 규칙과 절차는 `.claude/skills/game-version/SKILL.md` — 요약하면:
#   major  모델이 받는 입력의 **구조**가 달라진다 (에이전트·한 턴의 호출 구성·층)
#   minor  구조는 같고 **내용**이 달라진다 (프롬프트 규칙, 도구, 스냅샷 필드, 모델)
#   patch  보는 **값·표현**만 미세하게 달라진다 (문구 다듬기, 포맷, 정렬)
# 화면·테스트·문서만 고친 커밋은 올리지 않는다.
