version: 1

# max_retries — 요청 **하나**를 다시 부르는 횟수다(최초 호출은 세지 않는다). 에이전트
# 밖에 있는 이유: SDK 클라이언트가 제공자마다 프로세스에 하나라 자리별로 다른 값을
# 들 곳이 없다. 적지 않으면 SDK 기본값이 Anthropic 2 · OpenAI 2 · Google 0으로 갈려,
# 같은 설정이 제공자마다 다르게 돈다 (docs/llm/models.md §1-1).
max_retries: 2

# operator_channel — 휘발 상태 스냅샷을 오퍼레이터 롤 메시지로 넣을지다. 에이전트마다
# 적고, 생략하면 거짓(감독 발화 뒤에 접어 넣는다 — 자리는 어느 쪽이든 발화 뒤다). Google에는 그 롤이 없어 참을 적으면
# 시작할 때 거부된다 — Anthropic(`role:"system"`)·OpenAI(`role:"developer"`)로 옮기는
# 자리에서, 그 모델이 그 롤을 받는지 확인한 뒤 켠다 (docs/llm/models.md §3-3).

# thinking_level — 제공자 중립 눈금(minimal·low·medium·high)이다. 어댑터 셋이 각자의
# 파라미터로 옮긴다: Anthropic은 `thinking: adaptive` + `output_config.effort`,
# Google은 `thinkingConfig.thinkingLevel`, OpenAI는 Responses의 `reasoning.effort`.
# **적지 않으면 Anthropic·OpenAI는 그 파라미터를 아예 싣지 않는다** — 사고를 모르는
# 모델도 400 없이 돈다. Google만 생략 시 minimal이다 (docs/llm/models.md §1-2).
#
# ⚠️ 눈금을 받는 것은 제공자가 아니라 **모델**이다 — gemini-3.7-flash는 minimal에
# 400을 낸다. 모델을 올릴 때 이 줄을 함께 본다 (docs/llm/models.md §1-2).

# ⚠️ **해석기 계열(tactic-orders·training-orders·market-orders·training-rater)의 캐시
# 히트율 0은 프롬프트 탓이 아니다** — 이력 없이 system·도구·이번 턴 입력만 보내는 한 벌
# 요청이라 매번 같은 프리픽스가 5.7k뿐인데, Gemini의 암묵 캐시는 그 프리픽스가
# 3.6-flash 10.5k · 3.5-flash-lite 17.6k를 넘어야 걸리기 시작한다(2026-09 실측).
# 고정 블록을 contents 맨 앞으로 옮겨도, 요청을 글자까지 같게 되풀이해도 0이다. 이 자리의
# 고정분을 캐시에 얹는 길은 명시 캐시(`cachedContents`) 하나뿐이다
# (docs/llm/models.md §3 「Gemini」).
#
# ⚠️ **그 명시 캐시는 쓰지 않는다 — 걸리지 않아서가 아니라 적자라서다.** 걸리는 것은
# 확인했다(2026-09 실측: 이 자리의 고정분으로 cachedContents를 만들면 tactic-orders
# 5,581 · market-orders 4,066 토큰으로 생성되고, 문서가 적은 최소 4,096은 flash-lite에서
# 강제되지 않는다). 문제는 값이다. 명시 캐시는 **생성분이 정가**로 과금되고 **저장이
# 시간당** 과금이라, 캐시 하나가 사는 동안 그 에이전트가 충분히 자주 불려야 이득이 된다.
#
#   수명 T시간짜리 캐시가 N번 맞아야 본전:  N ≥ p_in/(p_in−p_cached) + T·p_storage/(p_in−p_cached)
#   토큰 수는 세 항에 똑같이 곱해져 사라진다 — **고정분이 얼마든 손익분기는 가격 비 하나다.**
#
#   gemini-3.5-flash-lite ($0.30 / $0.03 / $1.00 per 1M-token-hour):  N ≥ 1.11 + 3.70·T
#   3.x flash ($0.75 / $0.075 / $0.50; 2027-01-01에 셋 다 2배라 비는 그대로):  N ≥ 1.11 + 0.74·T
#
# 읽히는 것 둘: **한 번만 맞는 캐시는 수명이 0이어도 적자다**(1.11 > 1). 그리고 캐시를 계속
# 살려 두는 운영이면 조건은 호출 간격으로 바뀐다 — flash-lite는 같은 에이전트가 **16분마다**,
# 3.x flash는 81분마다 불려야 본전이다.
#
# 실측 밀도는 그 아래다. 기록된 한 판(2026-09-13, 48분, 호출 12건)에서 해석기는 3건이고
# 가장 바쁜 tactic-orders도 14.5분 간격으로 두 번이다. 기본 TTL 1시간으로 게으르게 만들었다면
# tactic-orders −$0.0042 · market-orders −$0.0042, 세션 $0.183가 $0.191로 **4.6% 비싸진다**.
# 꼭 맞을 때만 만들고 마지막 적중 직후 지우는 예지를 줘도 tactic-orders는 −$0.0000094다.
# 저장·생성이 공짜라고 가정한 이론 상한조차 세션의 2.2%($0.0041)뿐이다 — #828로 두 번째
# 요청이 사라진 뒤 이 자리의 고정분은 장부 전체의 2.5%밖에 되지 않는다.
#
# **다시 볼 조건은 밀도 하나다.** 캐시 키는 게임이 아니라 (에이전트 × 게임 버전)이라 한
# 서버가 여러 판을 돌리면 밀도가 판 수만큼 곱해진다 — 관측된 tactic-orders 2.5회/시로는
# **동시 두 판**부터 3.70회/시를 넘고, 나머지 셋은 더 뒤다. 지금은 로컬 한 판이다.
# 고정분이 커지는 것은 이유가 되지 않는다: 손익분기는 토큰 수와 무관하고, 고정분이 암묵
# 캐시 발화점(3.6-flash 10.5k · flash-lite 17.6k)을 넘으면 그때는 암묵 캐시가 공짜로 가져간다.

agents:
  gm:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 64000
    timeout_ms: 180000
    thinking_level: low

  # 감독의 말을 구조화된 의도 하나로 옮긴다 — 판단이 아니라 분류라 가벼운 모델로 둔다.
  # 경기 한 턴이 두 호출이 됐으므로(docs/llm/agents.md §3) 여기서 지연을 갚아야 한다.
  # 한 턴에 교체·전술·지시가 함께 올 수 있어 훈련 결산보다는 넉넉하다.
  tactic-orders:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 16000
    timeout_ms: 60000
    thinking_level: minimal

  # 감독의 훈련·육성 지시를 선수단 운영 명령의 인자로 옮긴다 — 전술 해석과 가른 이유는
  # 읽는 것이 다르기 때문이다(주간 일정·지금 걸린 목록). 분류라 가벼운 모델로 둔다.
  training-orders:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 16000
    timeout_ms: 60000
    thinking_level: minimal

  # 감독의 이적·재정 지시를 시장·장부 명령의 인자로 옮긴다 — 판 지시의 해석과 같은 자리
  # (docs/llm/agents.md §1). 분류라 가벼운 모델로 둔다.
  market-orders:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 16000
    timeout_ms: 60000
    thinking_level: minimal

  # 테이블의 감독 말 한 줄을 **이 협상 하나**의 명령 인자로 옮긴다 — 값·조건·답·수락·철회
  # (docs/llm/agents.md §4-1 · transfer.md §12-3). 시장 해석과 같은 분류라 같은 자리다.
  table-orders:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 16000
    timeout_ms: 60000
    thinking_level: minimal

  # 경기의 GM — 이 경기의 이력 전부를 쥐고 도구 셋으로 경기를 진행한다 (docs/llm/agents.md §3).
  # 시한은 도구 뒤의 해석·마감 호출까지 덮는다.
  match-gm:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 64000
    timeout_ms: 180000
    thinking_level: low

  # 끝난 경기의 결산과 마무리 중계 — 이 경기의 중계 전부를 읽으므로 싼 자리로 보내지
  # 않는다. 경기당 한 번이고 매치 GM의 도구 뒤에서 돈다.
  finalize-match:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 16000
    timeout_ms: 90000
    thinking_level: minimal

  # 협상 테이블 건너편 — GM의 도구 뒤에서 감독의 말 하나에 상대의 답 하나를 낸다
  # (docs/llm/agents.md §4-1). 서류·주변 상황·테이블의 대화 전부를 읽고 인물로 말하므로
  # 싼 자리로 보내지 않는다. 실패하면 앵커가 그대로 판정이라 시한은 짧다.
  negotiation-table:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 8000
    timeout_ms: 60000
    thinking_level: low

  training-rater:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 8000
    timeout_ms: 30000
    thinking_level: minimal

  # 도착한 스카우팅 보고서 한 묶음에 한 줄 평을 붙인다 (docs/llm/agents.md §4-4). 코어가
  # 낸 사실만 읽고 문장 하나를 내는 자리라 훈련 결산과 같은 싼 자리다. 실패하면 사실 줄만
  # 남으므로 시한도 짧다.
  scout-rater:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 8000
    timeout_ms: 30000
    thinking_level: minimal

  # 새 게임의 배경을 읽고 지갑·능력치의 결·시작 사건을 판정한 뒤, 그 위에서 부임 첫날의
  # 첫 장면까지 쓴다 (docs/llm/agents.md §4-2). **싼 자리로 보내지 않는다** — 판정만 낼
  # 때는 앵커가 답을 받쳐 줬지만 첫 장면에는 앵커가 없고, 그것이 이 게임의 첫인상이다.
  # 게임당 한 번뿐이라 이 자리의 값은 장부에 거의 서지 않는다.
  onboarding-judge:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 16000
    timeout_ms: 90000
    thinking_level: low

  # 접히는 평시 대화를 한 벌 요약으로 옮긴다 (docs/llm/agents.md §5-1). 결산과 같은
  # 계약이라 실패는 삼키지만 읽는 양이 다르다 — 한 번에 접히는 구간 전부를 읽고 거기
  # 새로 선 인물까지 판정하므로 훈련 결산의 싼 자리로 보내지 않는다. 압축은 이력이 상한을
  # 넘을 때만이라 드물게 돈다.
  history-compactor:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 8000
    timeout_ms: 60000
    thinking_level: low
