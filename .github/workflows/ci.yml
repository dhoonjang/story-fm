name: CI

# 검증의 자리는 여기다 — 로컬은 lint·typecheck와 방금 쓴 코드의 좁은 테스트까지,
# 전체 test와 e2e는 이 워크플로가 돌린다 (AGENTS.md §5).
#
# 드래프트 PR에는 돌지 않는다 (`ready-only` 조건). 작업 중인 브랜치는 푸시가
# 이어지는 동안 러너 분을 계속 태우는데 그 결과를 읽는 사람이 없다 — 판정이
# 필요한 순간은 `merge`가 ready로 올릴 때 하나뿐이고, `ready_for_review`가
# 그때 실행을 시작한다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# 같은 브랜치에 푸시가 이어지면 앞선 실행은 버린다 — 프라이빗 저장소라 러너 분이
# 과금되고, 어차피 마지막 커밋의 결과만 머지 게이트로 쓴다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 잡은 두 러너로 갈린다 — 코어가 아쉬운 잡 하나와, 아쉽지 않은 나머지.
#
#   CI_RUNNER       = ubicloud-standard-8   ← test (코어에 비례해 빨라진다)
#   CI_SHARDS       = [1]
#   CI_RUNNER_LIGHT = (미설정 → ubuntu-latest)  ← static · e2e
#
# 둘로 가르는 이유는 무료 한도가 두 군데에 따로 있기 때문이다. GitHub은 프라이빗
# 저장소에 월 2,000분을 주는데 외부 러너로 다 옮기면 그게 통째로 놀고, Ubicloud는
# 월 $2 크레딧(+$0.50 미만 미청구)이라 거기만 쓰면 그 한도부터 찬다. 코어를 늘려도
# 안 빨라지는 잡을 GitHub 쪽에 두면 양쪽 무료분을 같이 태운다.
#
# ⚠️ GitHub 2,000분이 소진되면 Free 플랜은 프라이빗 저장소의 Actions를 **멈춘다**.
# 그때는 CI_RUNNER_LIGHT를 ubicloud-standard-2로 걸면 그 잡들이 그쪽으로 넘어간다.
#
# 러너를 변수가 쥐는 이유 — 외부 러너는 붙지 못하면 잡이 큐에 걸린 채 타임아웃까지
# 가고 그동안 PR은 하나도 초록이 되지 않는다. 변수를 지우는 것이 곧 롤백이고, 그
# 경로에 커밋·리뷰·머지가 끼지 않는다.
#
# 샤드를 러너와 같이 옮긴 이유는 8코어 한 잡이 2코어 네 잡보다 싸기 때문이다.
# 잡마다 checkout + pnpm install에 1.5분씩 드는데 그 셋업은 테스트를 하나도
# 돌리지 않는다 — 잡이 여섯이면 9분이 거기로 간다.

# main push는 PR 이벤트가 아니라 draft 필드가 없다 — 앞의 항이 그걸 통과시킨다.
jobs:
  static:
    name: lint + typecheck
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # tsc도 eslint도 1분 안에 끝난다 — 코어를 얹을 자리가 아니다
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # lint는 typecheck가 깨져도 볼 값이 있다 — 한 잡에서 둘 다 끝까지 돌린다
      - if: ${{ !cancelled() }}
        run: pnpm lint

  test:
    name: unit + api (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # vitest 기본값은 `maxWorkers = max(cpus - 1, 1)` — 그대로 두면 워커 하나가
    # 전체를 직렬로 받는다. `--maxWorkers=100%`가 코어를 다 쓴다.
    #
    # 샤드를 늘리지 마라. 배분이 파일 경로 해시라 네 샤드가 세 배까지 어긋났고
    # (run 31963108859), 잡마다 checkout + pnpm install을 따로 낸다. 코어 하나에
    # 몰아주면 vitest가 잡 안에서 알아서 메운다.
    #
    # 코어를 더 얹어도 소용없는 지점은 가장 느린 한 파일이다 — 파일은 샤드로
    # 쪼개지지 않는다. 지금 바닥은 euro-knockout.test.ts (#69).
    timeout-minutes: 25
    strategy:
      # 한 샤드가 빨갛다고 나머지를 죽이지 않는다 — 빨간 PR은 실패를 한 번에 다
      # 보여야 고치는 왕복이 한 번으로 끝난다
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.CI_SHARDS || '[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LLM 키는 주지 않는다 — 코어 테스트는 LLM 없이 도는 것이 규약이고,
      # 키가 없어야 실제로 그런지 확인된다 (AGENTS.md §5)
      #
      # 샤드는 vitest가 파일 경로 해시로 가른다 — 파일이 늘면 배분이 다시 섞이되
      # 한 파일이 쪼개지지는 않는다. 샤드가 하나면 `--shard=1/1`, 즉 전부다.
      - run: pnpm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100%

  e2e:
    name: e2e (playwright)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # 브라우저 한 개를 직렬로 몬다 — 코어를 넷 더 줘도 그만큼 빨라지지 않는다.
    # 8코어에서 1m58s, 2코어에서 3~4분. 그 차이를 test 잡이 어차피 덮는다.
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 브라우저 바이너리는 Playwright 버전이 바뀔 때만 새로 받는다
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # playwright.config.ts가 LLM_MODE=mock·포트·데이터 디렉터리를 모두 쥔다.
      # CI에서는 reuseExistingServer가 꺼져 매번 제 dev 서버를 띄운다.
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
