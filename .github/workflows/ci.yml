name: CI

# 검증의 자리는 여기다 — 로컬은 lint·typecheck와 방금 쓴 코드의 좁은 테스트까지,
# 전체 test와 e2e는 이 워크플로가 돌린다 (AGENTS.md §5).
#
# 드래프트 PR에는 돌지 않는다 (`ready-only` 조건). 작업 중인 브랜치는 푸시가
# 이어지는 동안 러너 분을 계속 태우는데 그 결과를 읽는 사람이 없다 — 판정이
# 필요한 순간은 `merge`가 ready로 올릴 때 하나뿐이고, `ready_for_review`가
# 그때 실행을 시작한다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# 같은 브랜치에 푸시가 이어지면 앞선 실행은 버린다 — 프라이빗 저장소라 러너 분이
# 과금되고, 어차피 마지막 커밋의 결과만 머지 게이트로 쓴다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 잡은 두 러너로 갈린다 — 코어가 아쉬운 잡 하나와, 아쉽지 않은 나머지.
#
#   CI_RUNNER       = ubicloud-standard-8   ← test (코어에 비례해 빨라진다)
#   CI_SHARDS       = [1]
#   CI_RUNNER_LIGHT = (미설정 → ubuntu-latest)  ← static · e2e
#
# 둘로 가르는 이유는 무료 한도가 두 군데에 따로 있기 때문이다. GitHub은 프라이빗
# 저장소에 월 2,000분을 주는데 외부 러너로 다 옮기면 그게 통째로 놀고, Ubicloud는
# 월 $2 크레딧(+$0.50 미만 미청구)이라 거기만 쓰면 그 한도부터 찬다. 코어를 늘려도
# 안 빨라지는 잡을 GitHub 쪽에 두면 양쪽 무료분을 같이 태운다.
#
# ⚠️ GitHub 2,000분이 소진되면 Free 플랜은 프라이빗 저장소의 Actions를 **멈춘다**.
# 그때는 CI_RUNNER_LIGHT를 ubicloud-standard-2로 걸면 그 잡들이 그쪽으로 넘어간다.
#
# 러너를 변수가 쥐는 이유 — 외부 러너는 붙지 못하면 잡이 큐에 걸린 채 타임아웃까지
# 가고 그동안 PR은 하나도 초록이 되지 않는다. 변수를 지우는 것이 곧 롤백이고, 그
# 경로에 커밋·리뷰·머지가 끼지 않는다.
#
# 샤드를 러너와 같이 옮긴 이유는 8코어 한 잡이 2코어 네 잡보다 싸기 때문이다.
# 잡마다 checkout + pnpm install에 1.5분씩 드는데 그 셋업은 테스트를 하나도
# 돌리지 않는다 — 잡이 여섯이면 9분이 거기로 간다.
#
# 지금 PR 한 번이 무엇을 쓰는가 (run 31989287365, 위 변수 그대로):
#
#   잡                러너                 잡 전체   그중 실작업   과금
#   changes           ubuntu-latest            5초         1초     1분
#   lint + typecheck  ubuntu-latest           45초        21초     1분
#   e2e               ubuntu-latest          145초        96초     3분
#   unit + api        ubicloud-standard-8    210초       188초     4분
#
# 합 9분, 초록까지 3분 57초. 기준선(run 31983657517)은 합 10분에 4분 25초였고
# e2e가 241초/4분이었다 — 줄어든 것은 전부 e2e 한 잡이다.
#
# ⚠️ 벽시계는 이제 unit + api **하나**가 정하고, 그 잡은 같은 커밋에서도 210~255초로
# 흔들린다(Ubicloud 편차). 그래서 3분 57초는 4분 선에 걸쳐 있는 값이지 여유가
# 있는 값이 아니다. 그 잡을 더 줄이는 손잡이는 코어 하나뿐인데 — 파일 쪽은 재 봤고
# 없다(vitest.config.ts 주석) — 코어는 이 파일이 아니라 CI_RUNNER가 쥐고, 8코어를
# 유지하는 것이 지금의 선택이다. 셋업은 이미 싸다(pnpm 캐시가 듣는다).

jobs:
  # 무엇이 바뀌었는지 먼저 본다. `.md`만 바뀐 변경은 타입도 테스트도 화면도
  # 건드릴 수 없으므로 아래 세 잡을 건너뛴다 — 그것 말고는 전부 돈다.
  #
  # 판정을 여기 한 잡에 모으는 이유는 워크플로 수준 `paths-ignore`가 체크를 아예
  # 만들지 않기 때문이다. 체크가 없는 PR은 `merge`가 「돌지 않았다」로 읽고 멈춘다
  # (`.claude/skills/merge` §4). 이 잡은 언제나 돌아 체크를 하나 남기고, 건너뛴
  # 잡들은 skipped로 보인다.
  #
  # 판정을 넓히지 마라. `.ts`의 주석만 고쳤다는 것은 경로로 알 수 없고, 틀리는
  # 쪽의 값은 「빨간 걸 초록으로 넘긴다」다. 파일 목록이 비면 돌리는 쪽으로 넘어간다.
  #
  # main push는 PR 이벤트가 아니라 draft 필드가 없다 — 앞의 항이 그걸 통과시킨다.
  #
  # 1초 일하고 1분 과금되는 잡을 남겨 두는 이유: 이 판정을 세 잡의 첫 스텝으로
  # 옮기면 `.md`만 바뀐 PR이 1분이 아니라 3분을 낸다 — 스텝을 건너뛰어도 잡은
  # 잡대로 분을 문다. 코드 PR에서 아끼는 1분보다, 이 저장소가 docs를 코드보다
  # 먼저 올리는 규약을 쓰는 이상 잃는 쪽이 크다. 임계 경로에 얹는 값도 9초다
  # (run 31983657517: 실행 시작 01:00:27 → 이 잡 완료 01:00:36).
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      # 체크아웃하지 않는다 — 파일 이름만 있으면 되고 API가 그걸 준다
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/${{ github.event.number }}/files" --paginate --jq '.[].filename')
          else
            files=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files[].filename')
          fi
          echo "$files"
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: lint + typecheck
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # tsc도 eslint도 1분 안에 끝난다 — 코어를 얹을 자리가 아니다
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # lint는 typecheck가 깨져도 볼 값이 있다 — 한 잡에서 둘 다 끝까지 돌린다
      - if: ${{ !cancelled() }}
        run: pnpm lint

  test:
    name: unit + api (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # vitest 기본값은 `maxWorkers = max(cpus - 1, 1)` — 그대로 두면 워커 하나가
    # 전체를 직렬로 받는다. `--maxWorkers=100%`가 코어를 다 쓴다.
    #
    # 샤드를 늘리지 마라. 배분이 파일 경로 해시라 네 샤드가 세 배까지 어긋났고
    # (run 31963108859), 잡마다 checkout + pnpm install을 따로 낸다. 코어 하나에
    # 몰아주면 vitest가 잡 안에서 알아서 메운다.
    #
    # 이 잡의 벽은 꼬리가 아니라 **총 CPU**다. 가장 느린 두 파일(euro-knockout
    # 68초 · training-plan 54초)을 통째로 빼도 185초가 178초가 될 뿐이다 —
    # 쪼개 봐야 그 자리에 다른 파일이 선다. `pool`·`isolate`·`maxWorkers`도
    # 재 봤고 노이즈 안이다 (근거는 vitest.config.ts 주석).
    #
    # 그래서 이 잡을 줄이는 손잡이는 코어 하나뿐이다 — 이 파일이 아니라
    # `CI_RUNNER` 변수가 쥔다. 8코어에서 188~240초이고, 이 잡이 곧 초록까지의
    # 벽시계다 (e2e는 145초로 내려와 임계 경로에서 빠졌다).
    timeout-minutes: 25
    strategy:
      # 한 샤드가 빨갛다고 나머지를 죽이지 않는다 — 빨간 PR은 실패를 한 번에 다
      # 보여야 고치는 왕복이 한 번으로 끝난다
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.CI_SHARDS || '[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LLM 키는 주지 않는다 — 코어 테스트는 LLM 없이 도는 것이 규약이고,
      # 키가 없어야 실제로 그런지 확인된다 (AGENTS.md §5)
      #
      # 샤드는 vitest가 파일 경로 해시로 가른다 — 파일이 늘면 배분이 다시 섞이되
      # 한 파일이 쪼개지지는 않는다. 샤드가 하나면 `--shard=1/1`, 즉 전부다.
      - run: pnpm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100%

  e2e:
    name: e2e (playwright)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # 2코어로 충분하다 — 다만 그 이유는 "코어를 줘도 안 빨라져서"가 아니다.
    # 이 잡이 4분을 쓰던 동안 시간은 두 군데에 있었고 둘 다 코어와 무관했다:
    # 한 파일 안의 케이스가 나뉘지 않아 병렬도의 천장이 스펙 파일 수(넷)였고,
    # 대상이 dev 서버라 라우트마다 컴파일을 다시 냈다. 둘을 고친 뒤
    # (`playwright.config.ts` — `fullyParallel` + 빌드 대상) 같은 2코어에서
    # e2e 스텝이 194초 → 96초다 (run 31989287365).
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 브라우저 바이너리는 Playwright 버전이 바뀔 때만 새로 받는다
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # playwright.config.ts가 LLM_MODE=mock·포트·데이터 디렉터리를 모두 쥔다.
      # CI에서는 reuseExistingServer가 꺼져 매번 제 dev 서버를 띄운다.
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
