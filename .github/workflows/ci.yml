name: CI

# 검증의 자리는 여기다 — 로컬은 lint·typecheck와 방금 쓴 코드의 좁은 테스트까지,
# 전체 test와 e2e는 이 워크플로가 돌린다 (AGENTS.md §5).
#
# 드래프트 PR에는 돌지 않는다 (`ready-only` 조건). 작업 중인 브랜치는 푸시가
# 이어지는 동안 러너 분을 계속 태우는데 그 결과를 읽는 사람이 없다 — 판정이
# 필요한 순간은 `merge`가 ready로 올릴 때 하나뿐이고, `ready_for_review`가
# 그때 실행을 시작한다.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# 같은 브랜치에 푸시가 이어지면 앞선 실행은 버린다 — 프라이빗 저장소라 러너 분이
# 과금되고, 어차피 마지막 커밋의 결과만 머지 게이트로 쓴다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 잡은 두 러너로 갈린다 — 코어가 아쉬운 잡 하나와, 아쉽지 않은 나머지. 어느 러너로
# 가는지는 저장소 변수가 쥐고, **지금 값은 `gh variable list`가 답한다**:
#
#   CI_RUNNER       ← test (코어에 비례해 빨라진다) · 미설정이면 ubuntu-latest
#   CI_SHARDS       ← test 매트릭스 · 미설정이면 [1] (= `--shard=1/1`, 즉 전부)
#   CI_RUNNER_LIGHT ← changes · static · e2e · 미설정이면 ubuntu-latest
#
# 둘로 가르는 이유는 무료 한도가 두 군데에 따로 있기 때문이다. GitHub은 프라이빗
# 저장소에 월 2,000분을 주는데 외부 러너로 다 옮기면 그게 통째로 놀고, Ubicloud는
# 월 $2 크레딧(+$0.50 미만 미청구)이라 거기만 쓰면 그 한도부터 찬다. 코어를 늘려도
# 안 빨라지는 잡을 GitHub 쪽에 두면 양쪽 무료분을 같이 태운다.
#
# ⚠️ GitHub 2,000분이 소진되면 Free 플랜은 프라이빗 저장소의 Actions를 **멈춘다**.
# CI_RUNNER_LIGHT에 ubicloud-standard-2를 걸면 그 잡들이 그쪽으로 넘어간다.
#
# 러너를 변수가 쥐는 이유 — 외부 러너는 붙지 못하면 잡이 큐에 걸린 채 타임아웃까지
# 가고 그동안 PR은 하나도 초록이 되지 않는다. 변수를 지우는 것이 곧 롤백이고, 그
# 경로에 커밋·리뷰·머지가 끼지 않는다.
#
# 샤드를 러너와 같이 옮긴 이유는 8코어 한 잡이 2코어 네 잡보다 싸기 때문이다.
# 잡마다 checkout + pnpm install에 1.5분씩 드는데 그 셋업은 테스트를 하나도
# 돌리지 않는다 — 잡이 여섯이면 9분이 거기로 간다.
#
# PR 한 번이 무엇을 쓰는가 — run 31999772973을 잰 값이다. **그때의 구성**은
# CI_RUNNER=ubicloud-standard-8 · CI_SHARDS=[1] · CI_RUNNER_LIGHT 미설정이었다:
#
#   잡                러너                 잡 전체   그중 실작업   과금
#   changes           ubuntu-latest            3초         1초     1분
#   lint + typecheck  ubuntu-latest           47초        21초     1분   ← format:check 합류 전
#   e2e               ubuntu-latest          132초        91초     3분
#   unit + api        ubicloud-standard-8    243초       226초     5분
#
# 합 10분, 초록까지 4분 29초.
#
# e2e만 놓고 보면 241초 → 132초다. 합계가 그만큼 따라오지 않는 이유는 unit + api가
# **4분 선에 정확히 걸터앉아** 있어서다 — 235초면 4분, 243초면 5분으로 과금이
# 갈린다. 같은 스위트로 짝을 맞춰 잰 값(run 31983657517 ↔ 31989287365)은
# 10분/4분 25초 → 9분/3분 57초였고, 그 뒤 main이 테스트를 더 들여오면서 그 잡이
# 다시 선을 넘었다.
#
# 액션은 **커밋 SHA로 핀한다.** `@v4`는 움직이는 태그라 같은 커밋의 CI가 어제와 다른
# 코드를 돌릴 수 있고, 그 코드는 러너에서 저장소 체크아웃과 토큰을 함께 본다. 뒤의
# `# v4.x.y`는 사람이 읽을 자리이자 dependabot이 올릴 때 함께 고치는 자리다
# (`.github/dependabot.yml`가 주 1회 PR을 연다). 핀을 손으로 옮기지 마라 — 그 PR을
# 머지하는 것이 갱신 경로다.
#
# ⚠️ 그래서 벽시계도 과금도 이제 unit + api **하나**가 정한다. 그 잡은 같은 커밋에서도
# 188~243초로 흔들리고(Ubicloud 편차), 테스트 파일이 하나 늘 때마다 되돌릴 수 없이
# 올라간다(AGENTS.md §5 · vitest.config.ts). 더 줄이는 손잡이는 코어뿐인데 그건 이
# 파일이 아니라 CI_RUNNER가 쥐고, 8코어 유지가 지금의 선택이다. 셋업은 이미 싸다
# (pnpm 캐시가 듣는다).

jobs:
  # 무엇이 바뀌었는지 먼저 본다. `.md`만 바뀐 변경은 타입도 테스트도 화면도
  # 건드릴 수 없으므로 아래 세 잡을 건너뛴다 — 그것 말고는 전부 돈다.
  #
  # 판정을 여기 한 잡에 모으는 이유는 워크플로 수준 `paths-ignore`가 체크를 아예
  # 만들지 않기 때문이다. 체크가 없는 PR은 `merge`가 「돌지 않았다」로 읽고 멈춘다
  # (`.claude/skills/merge` §4). 이 잡은 언제나 돌아 체크를 하나 남기고, 건너뛴
  # 잡들은 skipped로 보인다.
  #
  # 판정을 넓히지 마라. `.ts`의 주석만 고쳤다는 것은 경로로 알 수 없고, 틀리는
  # 쪽의 값은 「빨간 걸 초록으로 넘긴다」다. 파일 목록이 비면 돌리는 쪽으로 넘어간다.
  #
  # main push는 PR 이벤트가 아니라 draft 필드가 없다 — 앞의 항이 그걸 통과시킨다.
  #
  # 1초 일하고 1분 과금되는 잡을 남겨 두는 이유: 이 판정을 세 잡의 첫 스텝으로
  # 옮기면 `.md`만 바뀐 PR이 1분이 아니라 3분을 낸다 — 스텝을 건너뛰어도 잡은
  # 잡대로 분을 문다. 코드 PR에서 아끼는 1분보다, 이 저장소가 docs를 코드보다
  # 먼저 올리는 규약을 쓰는 이상 잃는 쪽이 크다. 임계 경로에 얹는 값도 9초다
  # (run 31983657517: 실행 시작 01:00:27 → 이 잡 완료 01:00:36).
  changes:
    name: changes
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.scan.outputs.code }}
    steps:
      # 체크아웃하지 않는다 — 파일 이름만 있으면 되고 API가 그걸 준다
      - id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          truncated=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 리네임은 새 이름만 오면 반쪽이다 — `.ts`를 `.md`로 옮긴 변경이 목록에
            # `.md` 하나로만 서서 코드 잡을 통째로 건너뛴다. 사라진 쪽 이름도 함께 센다.
            files=$(gh api "repos/$REPO/pulls/${{ github.event.number }}/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)')
          else
            # 커밋 API는 파일 300개에서 잘리고 페이지를 더 주지 않는다 — 잘린 목록으로
            # 판정하는 것은 「빨간 걸 초록으로 넘긴다」다. 상한에 닿으면 목록을 안 믿는다.
            files=$(gh api "repos/$REPO/commits/${{ github.sha }}" \
              --jq '.files[]? | .filename, (.previous_filename // empty)')
            listed=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.files | length')
            if [ "${listed:-0}" -ge 300 ]; then truncated=1; fi
          fi
          echo "$files"
          if [ "$truncated" = 1 ] || printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: lint + typecheck + format
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # tsc도 eslint도 1분 안에 끝난다 — 코어를 얹을 자리가 아니다
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # lint도 format도 typecheck가 깨져도 볼 값이 있다 — 한 잡에서 셋 다 끝까지
      # 돌린다. 세 판정을 한 번의 왕복으로 다 보여 주는 편이 고치는 횟수를 줄인다.
      - if: ${{ !cancelled() }}
        run: pnpm lint
      # Prettier — 어긋난 파일 이름만 뱉는다. 고치는 명령은 `pnpm format`.
      - if: ${{ !cancelled() }}
        run: pnpm format:check
      # match-cli 픽스처는 도메인 스키마로 **런타임에** 파싱된다 — tsc도 eslint도
      # JSON 안을 보지 않으므로 스키마가 움직이면 아무 잡도 빨개지지 않은 채 썩는다.
      # `--dry`는 LLM을 부르지 않고 전력 패킷까지만 굴린다(키 불필요, 1초).
      - name: match-cli dry run
        if: ${{ !cancelled() }}
        run: pnpm match --dry

  test:
    name: unit + api (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # vitest 기본값은 `maxWorkers = max(cpus - 1, 1)` — 그대로 두면 워커 하나가
    # 전체를 직렬로 받는다. `--maxWorkers=100%`가 코어를 다 쓴다.
    #
    # 샤드를 늘리지 마라. 배분이 파일 경로 해시라 네 샤드가 세 배까지 어긋났고
    # (run 31963108859), 잡마다 checkout + pnpm install을 따로 낸다. 코어 하나에
    # 몰아주면 vitest가 잡 안에서 알아서 메운다.
    #
    # 이 잡의 벽은 꼬리가 아니라 **총 CPU**이고, 그 CPU는 파일 수가 정한다.
    # 가장 무거운 10파일(테스트 시간의 46%, 케이스 259개)을 통째로 빼도 196초가
    # 163초가 될 뿐이다 — 쪼개거나 지워서 나올 값이 아니다.
    # `pool`·`isolate`·`maxWorkers`도 재 봤고 노이즈 안이다
    # (근거는 vitest.config.ts 주석).
    #
    # 그래서 이 잡을 줄이는 손잡이는 코어 하나뿐이다 — 이 파일이 아니라
    # `CI_RUNNER` 변수가 쥔다. 8코어에서 188~243초이고, 이 잡이 곧 초록까지의
    # 벽시계다 (e2e는 132초로 내려와 임계 경로에서 빠졌다).
    timeout-minutes: 25
    strategy:
      # 한 샤드가 빨갛다고 나머지를 죽이지 않는다 — 빨간 PR은 실패를 한 번에 다
      # 보여야 고치는 왕복이 한 번으로 끝난다
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(vars.CI_SHARDS || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LLM 키는 주지 않는다 — 코어 테스트는 LLM 없이 도는 것이 규약이고,
      # 키가 없어야 실제로 그런지 확인된다 (AGENTS.md §5)
      #
      # 샤드는 vitest가 파일 경로 해시로 가른다 — 파일이 늘면 배분이 다시 섞이되
      # 한 파일이 쪼개지지는 않는다. 샤드가 하나면 `--shard=1/1`, 즉 전부다.
      - run: pnpm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100%

  e2e:
    name: e2e (playwright)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # 2코어로 충분하다 — 다만 그 이유는 "코어를 줘도 안 빨라져서"가 아니다.
    # 이 잡이 4분을 쓰던 동안 시간은 두 군데에 있었고 둘 다 코어와 무관했다:
    # 한 파일 안의 케이스가 나뉘지 않아 병렬도의 천장이 스펙 파일 수(넷)였고,
    # 대상이 dev 서버라 라우트마다 컴파일을 다시 냈다. 둘을 고친 뒤
    # (`playwright.config.ts` — `fullyParallel` + 빌드 대상) 같은 2코어에서
    # e2e 스텝이 194초 → 91초다 (run 31999772973).
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 브라우저 바이너리는 Playwright 버전이 바뀔 때만 새로 받는다
      - name: Resolve playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # playwright.config.ts가 LLM_MODE=mock·포트·데이터 디렉터리를 모두 쥔다.
      # CI에서는 reuseExistingServer가 꺼져 매번 **빌드한 앱**을 띄운다(`next start`).
      - run: pnpm e2e

      # 빨간 e2e를 읽는 유일한 창 — 러너 로그에는 실패한 단언 한 줄뿐이고 그 순간
      # 화면이 무엇이었는지가 없다. playwright.config.ts가 CI에서만 html 리포트와
      # 트레이스·스크린샷을 남기고, 그 둘을 여기서 올린다 (`merge` §4가 받아 본다).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          # 비어 있으면 스텝이 조용히 지나간다 — 리포터 설정이 빠진 것을 여기서 만난다
          if-no-files-found: error
          retention-days: 7
